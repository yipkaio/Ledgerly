<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 780" role="img" aria-label="Ledgerly UML use cases"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#527068"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#193c32;font-size:14px}.edge{fill:none;stroke:#527068;stroke-width:1.6;marker-end:url(#arrow)}.assoc{fill:none;stroke:#527068;stroke-width:1.3}</style><rect x="180" y="15" width="450" height="740" fill="#f7faf8" stroke="#98b5a8"/><text text-anchor="middle"><tspan x="405" y="45">Ledgerly application</tspan></text><path class="assoc" d="M85,380 L250,100"/><ellipse cx="415" cy="100" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="105">Sign in</tspan></text><path class="assoc" d="M85,380 L250,185"/><ellipse cx="415" cy="185" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="190">Submit a receipt</tspan></text><path class="assoc" d="M85,380 L250,270"/><ellipse cx="415" cy="270" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="275">Inspect and review receipts</tspan></text><path class="assoc" d="M85,380 L250,355"/><ellipse cx="415" cy="355" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="360">Amend or void accepted records</tspan></text><path class="assoc" d="M85,380 L250,440"/><ellipse cx="415" cy="440" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="445">Import a bank statement</tspan></text><path class="assoc" d="M85,380 L250,525"/><ellipse cx="415" cy="525" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="530">Review monthly reconciliation</tspan></text><path class="assoc" d="M85,380 L250,610"/><ellipse cx="415" cy="610" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="615">View reports and export</tspan></text><path class="assoc" d="M85,380 L250,695"/><ellipse cx="415" cy="695" rx="165" ry="29" fill="white" stroke="#527068"/><text text-anchor="middle"><tspan x="415" y="700">Ask Finance Copilot</tspan></text><g fill="none" stroke="#193c32" stroke-width="2"><circle cx="62" cy="348" r="10"/><path d="M62,358v34m-22,-22h44m-22,22l-20,26m20,-26l20,26"/></g><text text-anchor="middle"><tspan x="62" y="438">Authorised</tspan><tspan x="62" y="456">owner / reviewer</tspan></text><g fill="none" stroke="#193c32" stroke-width="2"><circle cx="740" cy="68" r="10"/><path d="M740,78v34m-22,-22h44m-22,22l-20,26m20,-26l20,26"/></g><text text-anchor="middle"><tspan x="740" y="158">Firebase</tspan></text><g fill="none" stroke="#193c32" stroke-width="2"><circle cx="740" cy="188" r="10"/><path d="M740,198v34m-22,-22h44m-22,22l-20,26m20,-26l20,26"/></g><text text-anchor="middle"><tspan x="740" y="278">OpenClaw</tspan></text><path class="assoc" d="M580,100H718 M580,185L718,220"/></svg>