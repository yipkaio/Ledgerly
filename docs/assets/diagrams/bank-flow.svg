<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1190" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Statement and monthly close</title>
<desc id="diagram-description">Bank statement workflow. PDF local extraction or optional consented AI produces a signed preview for human confirmation. CSV validates directly. Both retain source bytes and reconcile accepted receipts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#007A72"/></marker><marker id="support-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#78949A"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.kicker{font-size:13px;font-weight:700;letter-spacing:2px;fill:#007A72}.title{font-size:30px;font-weight:700;fill:#1E3341}.subtitle{font-size:15px;fill:#52666F}.panel-title{font-size:17px;font-weight:700;fill:#1E3341}.panel-body{font-size:14px;fill:#415660}.panel-kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#007A72}.panel-num{font-size:12px;font-weight:700;fill:#fff}.use-text{font-size:15px;font-weight:700;fill:#1E3341}.edge{stroke:#007A72;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.support{stroke:#78949A;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#support-arrow)}.assoc{stroke:#78A7A5;stroke-width:1.7;fill:none;stroke-linecap:round}.branch{font-size:12px;font-weight:700;fill:#52666F}.footer{font-size:13px;fill:#52666F}</style>
<rect width="1200" height="1190" fill="#FFFFFF"/>
<rect width="1200" height="9" fill="#007A72"/>
<image x="18" y="12" width="190" height="74" xlink:href="data:image/png;base64,"/>
<text class="kicker" x="228" y="53">TECHNICAL DESIGN</text>
<text class="title" x="36" y="97">Statement and monthly close</text>
<text class="subtitle" x="36" y="122">PDF confirmation and direct CSV validation converge on one monthly review</text>
<line x1="36" x2="1164" y1="139" y2="139" stroke="#D4E2E4" stroke-width="1.4"/>
<rect x="55" y="171" width="335" height="86" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="55" y="171" width="5" height="86" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="74" y="196">01 / PDF SOURCE</text>
<text class="panel-title" x="74" y="220">Bank-statement PDF</text>
<text class="panel-body" x="74" y="238">Allowed bookkeeper uploads</text>
<rect x="810" y="171" width="335" height="86" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="810" y="171" width="5" height="86" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="829" y="196">01 / CSV SOURCE</text>
<text class="panel-title" x="829" y="220">Normalized CSV</text>
<text class="panel-body" x="829" y="238">Allowed bookkeeper uploads</text>
<rect x="55" y="322" width="335" height="96" rx="14" fill="#E5F3F1" stroke="#007A72" stroke-width="1.5"/>
<rect x="55" y="322" width="5" height="96" rx="2.5" fill="#007A72"/>
<text class="panel-kicker" x="74" y="347">02 / PRIVATE-FIRST</text>
<text class="panel-title" x="74" y="371">Local extraction</text>
<text class="panel-body" x="74" y="389">PDF text or PaddleOCR;</text>
<text class="panel-body" x="74" y="407">deterministic debit parser</text>
<rect x="810" y="322" width="335" height="96" rx="14" fill="#E5F3F1" stroke="#007A72" stroke-width="1.5"/>
<rect x="810" y="322" width="5" height="96" rx="2.5" fill="#007A72"/>
<text class="panel-kicker" x="829" y="347">02 / DIRECT ROUTE</text>
<text class="panel-title" x="829" y="371">Validate CSV rows</text>
<text class="panel-body" x="829" y="389">Columns, period, currency,</text>
<text class="panel-body" x="829" y="407">positive debit values</text>
<path class="edge" d="M223 257 L223 322"/>
<path class="edge" d="M977 257 L977 322"/>
<rect x="55" y="525" width="335" height="94" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="55" y="525" width="5" height="94" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="74" y="550">03 / PDF CONTROL</text>
<text class="panel-title" x="74" y="574">Signed preview</text>
<text class="panel-body" x="74" y="592">File + preview hashes, expiry;</text>
<text class="panel-body" x="74" y="610">balance and row checks</text>
<path class="edge" d="M223 418 L223 525"/>
<rect x="453" y="525" width="314" height="94" rx="14" fill="#FFF7E8" stroke="#DAB26B" stroke-width="1.5"/>
<rect x="453" y="525" width="5" height="94" rx="2.5" fill="#DAB26B"/>
<text class="panel-kicker" x="472" y="550">OPTIONAL / CONSENT</text>
<text class="panel-title" x="472" y="574">AI layout fallback</text>
<text class="panel-body" x="472" y="592">Unsupported PDFs only;</text>
<text class="panel-body" x="472" y="610">bounded, masked text</text>
<path class="support" d="M390 370 L422 370 L422 553 L453 553"/>
<path class="support" d="M453 591 L405 591 L405 578 L390 578"/>
<text class="branch" x="429" y="354">IF UNSUPPORTED</text>
<rect x="810" y="525" width="335" height="94" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="810" y="525" width="5" height="94" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="829" y="550">03 / CSV CONTROL</text>
<text class="panel-title" x="829" y="574">Validated source</text>
<text class="panel-body" x="829" y="592">No PDF preview token</text>
<path class="edge" d="M977 418 L977 525"/>
<rect x="55" y="693" width="335" height="94" rx="14" fill="#E5F3F1" stroke="#007A72" stroke-width="1.5"/>
<rect x="55" y="693" width="5" height="94" rx="2.5" fill="#007A72"/>
<text class="panel-kicker" x="74" y="718">04 / CONFIRMATION</text>
<text class="panel-title" x="74" y="742">Human checks PDF</text>
<text class="panel-body" x="74" y="760">Compare source and debits;</text>
<text class="panel-body" x="74" y="778">expiry or tampering restarts</text>
<path class="edge" d="M223 619 L223 693"/>
<rect x="420" y="854" width="360" height="86" rx="14" fill="#E6F5ED" stroke="#75B9A0" stroke-width="1.5"/>
<rect x="420" y="854" width="5" height="86" rx="2.5" fill="#75B9A0"/>
<text class="panel-kicker" x="439" y="879">05 / EVIDENCE</text>
<text class="panel-title" x="439" y="903">Import + retain</text>
<text class="panel-body" x="439" y="921">Statement bytes and debit rows</text>
<path class="edge" d="M223 787 L223 824 L520 824 L520 854"/>
<path class="edge" d="M977 619 L977 824 L680 824 L680 854"/>
<rect x="420" y="984" width="360" height="107" rx="14" fill="#E5F3F1" stroke="#007A72" stroke-width="1.5"/>
<rect x="420" y="984" width="5" height="107" rx="2.5" fill="#007A72"/>
<text class="panel-kicker" x="439" y="1009">06 / MONTHLY CLOSE</text>
<text class="panel-title" x="439" y="1033">Match + record review</text>
<text class="panel-body" x="439" y="1051">Accepted receipts, exceptions,</text>
<text class="panel-body" x="439" y="1069">audited month decision</text>
<path class="edge" d="M600 940 L600 984"/>
<line x1="36" x2="1164" y1="1130" y2="1130" stroke="#D4E2E4"/>
<text class="footer" x="36" y="1151">A suggested match is not proof of payment. Invalid PDF previews or failed balance controls block confirmation.</text>
</svg>
