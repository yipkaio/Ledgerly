<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" role="img" aria-label="Bank-statement import and reconciliation"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#45695a"/></marker></defs><rect width="800" height="1040" fill="white"/><style>text{font:14px Arial,sans-serif;fill:#183f32}.e{stroke:#45695a;stroke-width:1.5;fill:none;marker-end:url(#arr)}</style><rect x="250" y="10" width="300" height="55" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="400.0" y="42.5">Authenticated statement upload</tspan></text><polygon points="400,100 512,145 400,190 288,145" fill="#fff4e2" stroke="#be9b63"/><text text-anchor="middle"><tspan x="400" y="150">PDF or CSV?</tspan></text><rect x="25" y="235" width="265" height="65" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="157.5" y="272.5">CSV: validate and normalise</tspan></text><rect x="510" y="235" width="265" height="65" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="642.5" y="272.5">PDF: local text extraction</tspan></text><polygon points="640,345 752,390 640,435 528,390" fill="#fff4e2" stroke="#be9b63"/><text text-anchor="middle"><tspan x="640" y="395">Supported layout?</tspan></text><rect x="35" y="360" width="285" height="70" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="177.5" y="391.0">Explicit consent for AI retry</tspan><tspan x="177.5" y="409.0">Unsupported PDF layout only</tspan></text><rect x="465" y="500" width="320" height="65" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="625.0" y="528.5">Preview extracted transactions</tspan><tspan x="625.0" y="546.5">Check balances and source</tspan></text><polygon points="625,610 737,655 625,700 513,655" fill="#fff4e2" stroke="#be9b63"/><text text-anchor="middle"><tspan x="625" y="660">Preview valid?</tspan></text><rect x="25" y="625" width="295" height="65" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="172.5" y="653.5">Block invalid preview</tspan><tspan x="172.5" y="671.5">Check layout or use CSV</tspan></text><rect x="465" y="755" width="320" height="65" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="625.0" y="783.5">Human evidence confirmation</tspan><tspan x="625.0" y="801.5">Verify signed preview and file</tspan></text><rect x="100" y="875" width="600" height="65" rx="8" fill="#f0f7f3" stroke="#94b5a4"/><text text-anchor="middle"><tspan x="400.0" y="903.5">Import and retain source; reconcile month and currency</tspan><tspan x="400.0" y="921.5">Match eligible accepted receipts to active bank debits</tspan></text><path class="e" d="M400,65V100"/><path class="e" d="M288,145H157V235"/><path class="e" d="M512,145H640V235"/><path class="e" d="M640,300V345"/><path class="e" d="M528,390H320"/><path class="e" d="M177,430V532H465"/><path class="e" d="M640,435V500"/><path class="e" d="M625,565V610"/><path class="e" d="M513,655H320"/><path class="e" d="M625,700V755"/><path class="e" d="M625,820V875"/><path class="e" d="M157,300V335H10V907H100"/><text text-anchor="middle"><tspan x="210" y="132">CSV</tspan></text><text text-anchor="middle"><tspan x="575" y="132">PDF</tspan></text><text text-anchor="middle"><tspan x="430" y="377">No</tspan></text><text text-anchor="middle"><tspan x="672" y="477">Yes</tspan></text><text text-anchor="middle"><tspan x="407" y="642">No</tspan></text><text text-anchor="middle"><tspan x="658" y="735">Yes</tspan></text></svg>