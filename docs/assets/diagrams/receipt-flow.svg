<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1402" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Receipt processing</title>
<desc id="diagram-description">Receipt workflow from web or Telegram through validation, exact-duplicate rejection, extraction, vendor mapping, category suggestion and confidence gate to auto-file or human review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#007A72"/></marker><marker id="support-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#78949A"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.kicker{font-size:13px;font-weight:700;letter-spacing:2px;fill:#007A72}.title{font-size:30px;font-weight:700;fill:#1E3341}.subtitle{font-size:15px;fill:#52666F}.panel-title{font-size:17px;font-weight:700;fill:#1E3341}.panel-body{font-size:14px;fill:#415660}.panel-kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#007A72}.panel-num{font-size:12px;font-weight:700;fill:#fff}.use-text{font-size:15px;font-weight:700;fill:#1E3341}.edge{stroke:#007A72;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.support{stroke:#78949A;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#support-arrow)}.assoc{stroke:#78A7A5;stroke-width:1.7;fill:none;stroke-linecap:round}.branch{font-size:12px;font-weight:700;fill:#52666F}.footer{font-size:13px;fill:#52666F}</style>
<rect width="1200" height="1402" fill="#FFFFFF"/>
<rect width="1200" height="9" fill="#007A72"/>
<image x="18" y="12" width="190" height="74" xlink:href="data:image/png;base64,"/>
<text class="kicker" x="228" y="53">TECHNICAL DESIGN</text>
<text class="title" x="36" y="97">Receipt processing</text>
<text class="subtitle" x="36" y="122">The two intake routes share one controlled extraction and review workflow</text>
<line x1="36" x2="1164" y1="139" y2="139" stroke="#D4E2E4" stroke-width="1.4"/>
<rect x="110" y="177" width="330" height="90" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="110" y="177" width="5" height="90" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="129" y="202">01 / INTAKE</text>
<text class="panel-title" x="129" y="226">Web browser</text>
<text class="panel-body" x="129" y="244">Firebase identity</text>
<rect x="760" y="177" width="330" height="90" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="760" y="177" width="5" height="90" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="779" y="202">01 / INTAKE</text>
<text class="panel-title" x="779" y="226">Telegram relay</text>
<text class="panel-body" x="779" y="244">Trusted API key</text>
<rect x="440" y="325" width="320" height="98" rx="14" fill="#E5F3F1" stroke="#007A72" stroke-width="1.5"/>
<rect x="440" y="325" width="5" height="98" rx="2.5" fill="#007A72"/>
<text class="panel-kicker" x="459" y="350">02 / BOUNDARY</text>
<text class="panel-title" x="459" y="374">Authenticate + validate</text>
<text class="panel-body" x="459" y="392">Media, size, signature and hash</text>
<path class="edge" d="M275 267 L275 295 L520 295 L520 325"/>
<path class="edge" d="M925 267 L925 295 L680 295 L680 325"/>
<path d="M600 460L760 520 600 580 440 520Z" fill="#FFF7E8" stroke="#D5AA60" stroke-width="1.9"/>
<text class="use-text" x="600" y="515.5" text-anchor="middle">Exact file</text>
<text class="use-text" x="600" y="534.5" text-anchor="middle">already retained?</text>
<path class="edge" d="M600 423 L600 460"/>
<rect x="850" y="480" width="285" height="91" rx="14" fill="#FFF7E8" stroke="#DAB26B" stroke-width="1.5"/>
<rect x="850" y="480" width="5" height="91" rx="2.5" fill="#DAB26B"/>
<text class="panel-kicker" x="869" y="505">STOP</text>
<text class="panel-title" x="869" y="529">Reject duplicate</text>
<text class="panel-body" x="869" y="547">No second receipt is stored</text>
<path class="edge" d="M760 520 L850 520"/>
<text class="branch" x="787" y="504">YES</text>
<rect x="440" y="617" width="320" height="99" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="440" y="617" width="5" height="99" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="459" y="642">03 / EXTRACTION</text>
<text class="panel-title" x="459" y="666">Read + structure</text>
<text class="panel-body" x="459" y="684">Native PDF text or local OCR;</text>
<text class="panel-body" x="459" y="702">AI extracts bounded fields</text>
<path class="edge" d="M600 580 L600 617"/>
<text class="branch" x="616" y="603">NO</text>
<path d="M600 747L760 805 600 863 440 805Z" fill="#FFF7E8" stroke="#D5AA60" stroke-width="1.9"/>
<text class="use-text" x="600" y="800.5" text-anchor="middle">Vendor mapping</text>
<text class="use-text" x="600" y="819.5" text-anchor="middle">exists?</text>
<path class="edge" d="M600 716 L600 747"/>
<rect x="110" y="900" width="330" height="95" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="110" y="900" width="5" height="95" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="129" y="925">04 / KNOWN VENDOR</text>
<text class="panel-title" x="129" y="949">Use saved category</text>
<text class="panel-body" x="129" y="967">Mapping confidence = 1.0</text>
<rect x="760" y="900" width="330" height="95" rx="14" fill="#F1F7F7" stroke="#D4E2E4" stroke-width="1.5"/>
<rect x="760" y="900" width="5" height="95" rx="2.5" fill="#D4E2E4"/>
<text class="panel-kicker" x="779" y="925">04 / UNMATCHED</text>
<text class="panel-title" x="779" y="949">Suggest category</text>
<text class="panel-body" x="779" y="967">Bounded category and confidence</text>
<path class="edge" d="M440 805 L275 805 L275 900"/>
<path class="edge" d="M760 805 L925 805 L925 900"/>
<text class="branch" x="348" y="788">YES</text>
<text class="branch" x="837" y="788">NO</text>
<rect x="440" y="1056" width="320" height="92" rx="14" fill="#E5F3F1" stroke="#007A72" stroke-width="1.5"/>
<rect x="440" y="1056" width="5" height="92" rx="2.5" fill="#007A72"/>
<text class="panel-kicker" x="459" y="1081">05 / APPLICATION RULE</text>
<text class="panel-title" x="459" y="1105">Decision gate</text>
<text class="panel-body" x="459" y="1123">Confidence, flags, duplicates</text>
<path class="edge" d="M275 995 L275 1027 L520 1027 L520 1056"/>
<path class="edge" d="M925 995 L925 1027 L680 1027 L680 1056"/>
<rect x="110" y="1207" width="330" height="90" rx="14" fill="#E6F5ED" stroke="#75B9A0" stroke-width="1.5"/>
<rect x="110" y="1207" width="5" height="90" rx="2.5" fill="#75B9A0"/>
<text class="panel-kicker" x="129" y="1232">06 / ELIGIBLE</text>
<text class="panel-title" x="129" y="1256">AUTO_FILED</text>
<text class="panel-body" x="129" y="1274">Saved with original source</text>
<rect x="760" y="1207" width="330" height="90" rx="14" fill="#FFF7E8" stroke="#DAB26B" stroke-width="1.5"/>
<rect x="760" y="1207" width="5" height="90" rx="2.5" fill="#DAB26B"/>
<text class="panel-kicker" x="779" y="1232">06 / UNCERTAIN</text>
<text class="panel-title" x="779" y="1256">Human review queue</text>
<text class="panel-body" x="779" y="1274">Compare source; audited decision</text>
<path class="edge" d="M600 1148 L600 1177 L275 1177 L275 1207"/>
<path class="edge" d="M600 1177 L925 1177 L925 1207"/>
<text class="branch" x="173" y="1172">CLEAN</text>
<text class="branch" x="944" y="1172">FLAGGED</text>
<line x1="36" x2="1164" y1="1342" y2="1342" stroke="#D4E2E4"/>
<text class="footer" x="36" y="1363">Only clean results auto-file. A failed extraction returns a controlled error or a FAILED record when processing has begun.</text>
</svg>
