[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly"
version = "0.1.0"
description = "Ledgerly receipt review and monthly bank reconciliation workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "XlsxWriter>=3.2,<4.0",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
ocr-paddle = [
    "paddleocr>=3.7,<4.0",
    # Paddle OCR's dependency chain uses setuptools at runtime.
    "setuptools>=83",
    # PaddlePaddle 3.3.x has a CPU/oneDNN regression affecting PP-OCR models.
    "paddlepaddle==3.3.1",
]
test = [
    "pytest>=9.0.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
