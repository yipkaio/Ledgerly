[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-classification-agent"
version = "0.1.0"
description = "Secure receipt intake API for an AI expense-classification pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
ocr-paddle = [
    "paddleocr>=3.7,<4.0",
    # PaddlePaddle 3.3.x has a CPU/oneDNN regression affecting PP-OCR models.
    "paddlepaddle==3.2.2",
]
test = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
